
name: Deploy Website with GitHub Actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  check:
    name: Check Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files exist!"

      - name: Check HTML title
        run: |
          if ! grep -Eiq '<title[^>]*>[^<]+</title>' index.html; then
            echo "ERROR: index.html is missing the title tag!"
            exit 1
          fi
          echo "HTML title is valid!"

  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    needs: check

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
